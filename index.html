<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooming Bouquet — Hanakotoba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>

/* =========================================================
   RESET & ROOT
========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }

:root{
    --ink:        #5c2a3a;
    --ink-soft:   #8a5866;
    --cream:      #fffaf4;
    --gold:       #c79a5c;
    --gold-soft:  #e7cfa1;
    --rose-red:   #c94e7b;
    --paper-blush:#f2c7d1;
    --paper-cream:#fbf3ec;
}

body{
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Playfair Display", Georgia, serif;
    color: var(--ink);
    background: radial-gradient(circle at 50% 8%, #fff6ee 0%, #fbe4e1 36%, #e7c3cd 66%, #c98fa0 100%);
}

/* =========================================================
   SCENE
========================================================= */
.scene{
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    padding: 34px 0 130px;
}

.glow{
    position: absolute;
    width: 760px; height: 760px;
    top: -300px; left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,224,180,.5), rgba(255,255,255,0) 70%);
    pointer-events: none;
    z-index: 0;
}

.bokeh{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,214,225,.15) 70%);
    filter: blur(1px);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    animation: bokehFloat linear infinite;
}
@keyframes bokehFloat{
    0%   { opacity: 0; transform: translateY(30px) scale(.6); }
    12%  { opacity: .5; }
    88%  { opacity: .38; }
    100% { opacity: 0; transform: translateY(-240px) scale(1); }
}

/* =========================================================
   HINT TEXT (replaces old static name labels)
========================================================= */
.hint-text{
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%) translateY(-8px);
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(15px, 2.6vw, 18px);
    color: var(--ink-soft);
    opacity: 0;
    z-index: 70;
    letter-spacing: .3px;
}
.hint-text.show{ animation: hintIn 1.3s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes hintIn{
    0%   { opacity: 0; transform: translateX(-50%) translateY(4px); }
    100% { opacity: .85; transform: translateX(-50%) translateY(0); }
}

/* =========================================================
   BOUQUET CONTAINER
========================================================= */
.bouquet-stage{
    position: relative;
    margin-top: 50px;
}
.bouquet{
    position: absolute;
    top: 0; left: 0;
    width: 1000px;
    height: 1220px;
    transform-origin: top left;
    perspective: 1300px;
}

/* =========================================================
   WRAPPING PAPER — bigger, clearer, wraps the low blooms
   while the sunflowers rise proudly above it
========================================================= */
.paper-back{
    position: absolute;
    left: 50%; bottom: 27px;
    transform: translateX(-50%) scaleY(0);
    transform-origin: bottom center;
    width: 940px; height: 1150px;
    background:
        linear-gradient(160deg, #fff6f0 0%, #f9dbe2 22%, #f0b8c8 48%, #e39fb5 70%, #f3c9d4 88%, #fff6f0 100%);
    clip-path: polygon(10% 0%, 90% 0%, 100% 40%, 64% 100%, 36% 100%, 0% 40%);
    opacity: 0;
    z-index: 1;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55);
    filter: drop-shadow(0 32px 42px rgba(120,50,70,.28));
}
.paper-back::before{
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(112deg, rgba(255,255,255,.55) 0 2px, transparent 2px 30px);
    opacity: .35;
    mix-blend-mode: overlay;
}
.paper-back::after{
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.3), transparent 30%, transparent 70%, rgba(90,30,50,.12));
}

.paper-front{
    position: absolute;
    z-index: 15;
    left: 50%; bottom: 14px;
    transform: translateX(-50%) scaleY(0);
    transform-origin: bottom center;
    width: 660px; height: 800px;
    background:
        linear-gradient(160deg, #fffaf5 0%, #fbe6ea 20%, #f3c3d0 50%, #fbe6ea 80%, #fffaf5 100%);
    clip-path: polygon(8% 0%, 92% 0%, 100% 42%, 62% 100%, 38% 100%, 0% 42%);
    opacity: 0;
    filter: drop-shadow(0 22px 30px rgba(140,50,80,.28));
}
.paper-front::before{
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(108deg, rgba(255,255,255,.5) 0 2px, transparent 2px 24px);
    opacity: .4;
    mix-blend-mode: overlay;
}

/* =========================================================
   FLOWER LAYER — always drawn ABOVE the paper
========================================================= */
.flowers{
    position: absolute;
    inset: 0;
    z-index: 30;
    transform-style: preserve-3d;
}

/* clickable affordance */
.sunflower, .carnation, .rose, .daisy{ cursor: pointer; }
.sun-head, .carnation-head, .rose-head, .daisy-head{
    transition: transform .3s ease, filter .3s ease;
}
.sun-head:hover, .carnation-head:hover, .rose-head:hover, .daisy-head:hover{
    transform: scale(1.06);
    filter: brightness(1.04) drop-shadow(0 10px 18px rgba(120,40,70,.3));
}

/* =========================================================
   GENERIC STEM
========================================================= */
.stem{
    position: absolute;
    bottom: 0; left: 50%;
    width: 15px; height: 0;
    transform: translateX(-50%) scaleY(0);
    transform-origin: bottom center;
    border-radius: 20px;
    background: linear-gradient(90deg,#175e2b,#3eaa49,#238039,#125c28);
    box-shadow: inset 2px 0 2px rgba(255,255,255,.22), 3px 0 8px rgba(40,70,35,.2);
}
.grow-stem{ animation: stemGrowth 1.8s cubic-bezier(.2,.9,.25,1) forwards; }
@keyframes stemGrowth{
    0%   { height: 0; transform: translateX(-50%) scaleY(.05); }
    70%  { transform: translateX(-50%) scaleY(1.04); }
    100% { transform: translateX(-50%) scaleY(1); }
}

/* =========================================================
   LEAVES
========================================================= */
.leaf{
    position: absolute;
    width: 135px; height: 62px;
    border-radius: 100% 0 100% 0;
    background: linear-gradient(135deg,#5cc061 0%,#2e8b3b 45%,#12481f 100%);
    opacity: 0;
    transform: scale(0) rotate(-25deg);
    transform-origin: 0 50%;
    filter: drop-shadow(3px 5px 5px rgba(20,55,25,.25));
}
.leaf::after{
    content: "";
    position: absolute;
    width: 101px; height: 2px;
    top: 50%; left: 8px;
    transform: rotate(-7deg);
    background: rgba(255,255,255,.25);
    border-radius: 10px;
}
.leaf::before{
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(ellipse at 25% 20%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
}
.leaf.show{ animation: leafGrow .9s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes leafGrow{
    0%   { opacity: 0; transform: scale(0) rotate(-30deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(-3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* =========================================================
   SUNFLOWER  — triangle: 1 top, 2 below, rising above the wrap
========================================================= */
.sunflower{ position: absolute; width: 252px; left: 50%; transform-style: preserve-3d; }
.sunflower.top   { height: 1085px; top: 0px;   transform: translateX(-50%) rotate(0deg);   transform-origin: 50% 100%; }
.sunflower.left  { height: 1001px; top: 84px;  transform: translateX(-50%) rotate(-20deg); transform-origin: 50% 100%; }
.sunflower.right { height: 1001px; top: 84px;  transform: translateX(-50%) rotate(20deg);  transform-origin: 50% 100%; }
.sunflower.top .stem{ height: 896px; }
.sunflower.left .stem, .sunflower.right .stem{ height: 812px; }

.sun-head{
    position: absolute;
    width: 227px; height: 227px;
    left: 12px; top: 0;
    border-radius: 50%;
    transform: scale(.14);
    transform-origin: center bottom;
    opacity: 0;
    transform-style: preserve-3d;
}
.sun-head.open{ animation: sunflowerHead 1.3s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes sunflowerHead{
    0%   { opacity: 0; transform: scale(.12); }
    45%  { opacity: 1; transform: scale(.42); }
    75%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
}

.sun-petal{
    position: absolute;
    width: 49px; height: 119px;
    left: 89px; top: 0px;
    border-radius: 55% 55% 48% 48%;
    background: linear-gradient(100deg,#c98600 0%,#ffc928 28%,#fff0a3 48%,#ffdc4c 58%,#e7a400 100%);
    transform-origin: 50% 100%;
    transform: rotate(calc(var(--angle) * .1)) rotateX(18deg) scaleY(.12);
    opacity: 0;
    box-shadow:
        inset 4px 0 5px rgba(255,255,255,.4),
        inset -5px 0 7px rgba(130,75,0,.22),
        3px 5px 7px rgba(120,70,0,.2);
}
.sun-petal::after{
    content: "";
    position: absolute;
    left: 30%; top: 8%;
    width: 34%; height: 42%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
}
.sun-head.open .sun-petal{
    animation: petalOpen 1.3s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(var(--i) * 50ms);
}
@keyframes petalOpen{
    0%   { opacity: 0;  transform: rotate(calc(var(--angle) * .1))  rotateX(18deg) scaleY(.12); }
    35%  { opacity: .5; transform: rotate(calc(var(--angle) * .3))  rotateX(18deg) scaleY(.3); }
    65%  { opacity: 1;  transform: rotate(calc(var(--angle) * .8))  rotateX(18deg) scaleY(.85); }
    85%  { opacity: 1;  transform: rotate(var(--angle)) rotateX(18deg) scaleY(1.1); }
    100% { opacity: 1;  transform: rotate(var(--angle)) rotateX(18deg) scaleY(1); }
}

.sun-center{
    position: absolute;
    left: 55px; top: 55px;
    width: 116px; height: 116px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #8a5a3c 0%, #63361f 45%, #2c1409 100%);
    border: 9px solid #855022;
    box-shadow:
        inset 5px 5px 6px rgba(255,255,255,.16),
        inset -8px -9px 12px rgba(0,0,0,.3),
        4px 8px 14px rgba(60,30,15,.35);
    z-index: 20;
    transform: scale(0);
}
.sun-head.open .sun-center{ animation: centerAppear .8s .78s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes centerAppear{
    from { transform: scale(0); }
    70%  { transform: scale(1.08); }
    to   { transform: scale(1); }
}
.sun-center::before{
    content: "";
    position: absolute; inset: 15px;
    border-radius: 50%;
    background: radial-gradient(circle, #1c0d08 3px, transparent 4px);
    background-size: 17px 17px;
    opacity: .7;
}
.sun-center::after{
    content: "";
    position: absolute;
    left: 14%; top: 12%;
    width: 30%; height: 26%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,220,150,.4), rgba(255,255,255,0) 70%);
}

/* =========================================================
   CARNATION — gathered at the wrap's mouth
========================================================= */
.carnation{ position: absolute; width: 270px; height: 772px; left: 50%; top: 313px; transform: translateX(-50%) rotate(0deg); transform-origin: 50% 100%; transform-style: preserve-3d; }
.carnation .stem{ height: 624px; }

.carnation-head{
    position: absolute;
    left: 27px; top: 0;
    width: 216px; height: 203px;
    border-radius: 50%;
    transform: scale(.12);
    opacity: 0;
    transform-style: preserve-3d;
}
.carnation-head.open{ animation: carnationBloom 1.6s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes carnationBloom{
    0%   { opacity: 0; transform: scale(.1); }
    40%  { opacity: 1; transform: scale(.4); }
    70%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
}

.carnation-layer{
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(.15);
    width: var(--size); height: var(--size);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd3e2 0%, #f48fb1 48%, #c4477c 100%);
    box-shadow:
        inset 0 6px 6px rgba(255,255,255,.45),
        inset 0 -10px 12px rgba(130,30,70,.24);
    clip-path: polygon(50% 0%,56% 9%,64% 3%,69% 13%,78% 8%,82% 19%,92% 17%,91% 29%,100% 34%,92% 43%,98% 52%,88% 57%,94% 68%,82% 70%,84% 82%,72% 79%,68% 91%,58% 84%,50% 100%,43% 89%,32% 95%,29% 83%,17% 86%,19% 74%,7% 71%,12% 60%,2% 54%,10% 44%,1% 35%,11% 29%,8% 18%,20% 20%,23% 9%,34% 14%,42% 4%);
}
.carnation-head.open .carnation-layer{
    animation: carnationLayer 1.2s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(var(--layer) * 170ms);
}
@keyframes carnationLayer{
    from { transform: translate(-50%,-50%) scale(.1) rotate(-30deg) rotateX(14deg); }
    60%  { transform: translate(-50%,-50%) scale(.6) rotate(-10deg) rotateX(14deg); }
    85%  { transform: translate(-50%,-50%) scale(1.08) rotate(5deg) rotateX(14deg); }
    to   { transform: translate(-50%,-50%) scale(1) rotate(0) rotateX(14deg); }
}

/* =========================================================
   ROSE — pinching the carnation on both sides
========================================================= */
.rose{ position: absolute; width: 216px; height: 737px; top: 348px; left: 50%; transform-style: preserve-3d; }
.rose.left{ transform: translateX(-50%) rotate(-14deg); transform-origin: 50% 100%; }
.rose.right{ transform: translateX(-50%) rotate(14deg); transform-origin: 50% 100%; }
.rose .stem{ height: 602px; }

.rose-head{
    position: absolute;
    left: 30px; top: 0;
    width: 162px; height: 162px;
    border-radius: 50%;
    transform: scale(.08);
    opacity: 0;
    transform-style: preserve-3d;
}
.rose-head.open{ animation: roseBloom 1.5s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes roseBloom{
    0%   { opacity: 0; transform: scale(.08) rotate(-35deg); }
    40%  { opacity: 1; transform: scale(.4) rotate(-24deg); }
    75%  { opacity: 1; transform: scale(1.1) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
}

.rose-outer{
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #ffd9e6 0%, #f28db1 33%, #d24d78 68%, #9c2952 100%);
    box-shadow:
        inset 7px 8px 9px rgba(255,255,255,.4),
        inset -8px -10px 13px rgba(110,15,55,.3),
        4px 8px 12px rgba(100,40,60,.25);
}
.rose-petal{
    position: absolute;
    border-radius: 50%;
    border: 4px solid rgba(160,45,90,.5);
    background: linear-gradient(150deg,#ffdde8,#ee8db2 55%,#bc4470);
    box-shadow:
        inset 3px 3px 4px rgba(255,255,255,.45),
        inset -3px -3px 5px rgba(110,25,65,.22);
    transform: scale(.15) rotateX(16deg);
    opacity: 0;
}
.rose-head.open .rose-petal{ animation: rosePetal 1.2s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes rosePetal{
    from { opacity: 0; transform: scale(.15) rotate(-35deg) rotateX(16deg); }
    45%  { opacity: 1; transform: scale(.5) rotate(-18deg) rotateX(16deg); }
    75%  { opacity: 1; transform: scale(1.08) rotate(5deg) rotateX(16deg); }
    to   { opacity: 1; transform: scale(1) rotate(0) rotateX(16deg); }
}
.rp1{ width: 88px; height: 65px; left: 30px; top: 45px; }
.rp2{ width: 81px; height: 61px; left: 54px; top: 27px; }
.rp3{ width: 84px; height: 63px; left: 57px; top: 70px; }
.rp4{ width: 74px; height: 58px; left: 23px; top: 73px; }

.rose-center{
    position: absolute;
    left: 63px; top: 58px;
    width: 43px; height: 43px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffe3ec, #c8496f);
    border: 6px solid #a83a63;
    z-index: 20;
    transform: scale(0);
}
.rose-head.open .rose-center{ animation: centerAppear .8s .68s cubic-bezier(.16,1,.3,1) forwards; }

/* =========================================================
   DAISY x4 — gathered lowest, inside the wrap
========================================================= */
.daisy{ position: absolute; width: 170px; height: 572px; top: 513px; left: 50%; transform-style: preserve-3d; }
.daisy.d1{ transform: translateX(-50%) rotate(-26deg); transform-origin: 50% 100%; }
.daisy.d2{ transform: translateX(-50%) rotate(-9deg);  transform-origin: 50% 100%; }
.daisy.d3{ transform: translateX(-50%) rotate(9deg);   transform-origin: 50% 100%; }
.daisy.d4{ transform: translateX(-50%) rotate(26deg);  transform-origin: 50% 100%; }
.daisy .stem{ height: 477px; }

.daisy-head{
    position: absolute;
    width: 142px; height: 142px;
    left: 14px; top: 0;
    transform: scale(.08);
    opacity: 0;
    transform-style: preserve-3d;
}
.daisy-head.open{ animation: daisyBloom 1.3s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes daisyBloom{
    from { opacity: 0; transform: scale(.08); }
    45%  { opacity: 1; transform: scale(.4); }
    75%  { opacity: 1; transform: scale(1.1); }
    to   { opacity: 1; transform: scale(1); }
}

.daisy-petal{
    position: absolute;
    left: 51px; top: 3px;
    width: 39px; height: 74px;
    border-radius: 60% 60% 50% 50%;
    background: linear-gradient(100deg,#dcd9cf,#ffffff 42%,#f4f2eb 60%,#e5e2d8);
    transform-origin: 50% 100%;
    transform: rotate(calc(var(--angle) * .12)) rotateX(16deg) scaleY(.1);
    opacity: 0;
    box-shadow:
        inset 3px 0 3px rgba(255,255,255,.6),
        2px 4px 5px rgba(90,80,70,.16);
}
.daisy-head.open .daisy-petal{
    animation: daisyPetal 1.1s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(var(--i) * 55ms);
}
@keyframes daisyPetal{
    from { opacity: 0;  transform: rotate(calc(var(--angle) * .12)) rotateX(16deg) scaleY(.1); }
    40%  { opacity: .6; transform: rotate(calc(var(--angle) * .4))  rotateX(16deg) scaleY(.35); }
    70%  { opacity: 1;  transform: rotate(calc(var(--angle) * .9))  rotateX(16deg) scaleY(1.12); }
    to   { opacity: 1;  transform: rotate(var(--angle)) rotateX(16deg) scaleY(1); }
}

.daisy-center{
    position: absolute;
    left: 45px; top: 45px;
    width: 53px; height: 53px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #fff5b0, #ffc91d 55%, #c98600 100%);
    box-shadow:
        inset 3px 3px 4px rgba(255,255,255,.4),
        inset -4px -6px 7px rgba(140,90,0,.28);
    z-index: 20;
    transform: scale(0);
}
.daisy-head.open .daisy-center{ animation: centerAppear .8s .68s cubic-bezier(.16,1,.3,1) forwards; }

/* =========================================================
   RIBBON
========================================================= */
.ribbon{
    position: absolute;
    z-index: 32;
    left: 50%; bottom: 62px;
    width: 351px; height: 146px;
    transform: translateX(-50%) scale(0);
    opacity: 0;
}
.ribbon.show{ animation: ribbonAppear 1s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes ribbonAppear{
    from { opacity: 0; transform: translateX(-50%) scale(0); }
    70%  { opacity: 1; transform: translateX(-50%) scale(1.06); }
    to   { opacity: 1; transform: translateX(-50%) scale(1); }
}
.ribbon-left, .ribbon-right{
    position: absolute; top: 22px;
    width: 146px; height: 86px;
    background: linear-gradient(145deg,#e7cf9f,#a8824f);
    box-shadow: 4px 8px 12px rgba(80,60,30,.25);
}
.ribbon-left{ right: 50%; border-radius: 15px 5px 45px 10px; transform: rotate(12deg); }
.ribbon-right{ left: 50%; border-radius: 5px 15px 10px 45px; transform: rotate(-12deg); }
.ribbon-center{
    position: absolute; left: 50%; top: 41px;
    width: 68px; height: 68px;
    transform: translateX(-50%);
    border-radius: 12px;
    background: linear-gradient(145deg,#e2c592,#9c7c4c);
    box-shadow: 0 6px 12px rgba(70,50,20,.25);
}
.ribbon-tail{
    position: absolute; top: 81px;
    width: 92px; height: 113px;
    background: linear-gradient(145deg,#d8bf8d,#9a7d51);
    clip-path: polygon(0 0,100% 0,76% 100%,48% 78%,20% 100%);
}
.ribbon-tail.left{ left: 84px; transform: rotate(8deg); }
.ribbon-tail.right{ right: 84px; transform: scaleX(-1) rotate(8deg); }

/* =========================================================
   SPARKLES
========================================================= */
.sparkle{
    position: absolute; z-index: 55;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8ec, #ffd98f);
    box-shadow: 0 0 14px rgba(255,214,150,.9);
    opacity: 0;
}
.sparkle.active{ animation: sparkleFloat 2.5s ease forwards; }
@keyframes sparkleFloat{
    0%   { opacity: 0; transform: translateY(20px) scale(.2); }
    30%  { opacity: 1; transform: translateY(0) scale(1.3); }
    100% { opacity: 0; transform: translateY(-45px) scale(.2); }
}

/* =========================================================
   CONTROLS
========================================================= */
.controls{
    position: fixed; z-index: 100;
    left: 50%; bottom: 22px;
    transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
}
button{
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 15px;
    letter-spacing: .3px;
    cursor: pointer;
    transition: .25s ease;

<script>

/* =========================================================
   MEANINGS (hanakotoba)
========================================================= */
const meanings = {
    sun: {
        emoji: "🌻",
        title: "Bunga Matahari (Himawari)",
        body: [
            "Melambangkan kekaguman, loyalitas, dan pesan emosional “aku hanya melihatmu” (I only have eyes for you).",
            "Tiga tangkai menguatkan pernyataan cinta dan fokus yang tidak terbagi pada satu orang."
        ]
    },
    carn: {
        emoji: "🌸",
        title: "Karnelion Merah Muda (Pinku no Kaneshon)",
        body: [
            "Mewakili cinta yang abadi dan pesan “aku tidak akan pernah melupakanmu”.",
            "Bunga ini menambahkan lapisan rasa syukur, kelembutan, dan kasih sayang yang hangat."
        ]
    },
    rose: {
        emoji: "🌹",
        title: "Mawar Merah Muda (Pinku no Bara)",
        body: [
            "Membawa makna keanggunan, rasa percaya (trust), dan kebahagiaan.",
            "Dalam asmara, mawar merah muda menyatakan janji cinta yang lembut dan rasa syukur memiliki pasangan tersebut, bukan sekadar gairah sesaat."
        ]
    },
    daisy: {
        emoji: "🌼",
        title: "Daisy Putih (Shiroi Hinagiku)",
        body: [
            "Melambangkan kemurnian, kepolosan, dan cinta yang setia, mengikat seluruh buket dengan kesan ketulusan tanpa pamrih."
        ]
    },
    all: {
        emoji: "🌷",
        title: "Makna Buket Ini (Hanakotoba)",
        body: [
            "Dalam hanakotoba (bahasa bunga Jepang), komposisi buket ini merangkai pesan tentang cinta yang murni, pengabdian tak tergoyahkan, dan apresiasi yang mendalam.",
            "🌻 Bunga Matahari — kekaguman, loyalitas, dan “aku hanya melihatmu”. Tiga tangkai menegaskan fokus cinta yang tidak terbagi.",
            "🌸 Karnelion Merah Muda — cinta abadi, “aku tidak akan pernah melupakanmu”, rasa syukur dan kasih yang hangat.",
            "🌹 Mawar Merah Muda — keanggunan, kepercayaan, dan kebahagiaan; janji cinta yang lembut.",
            "🌼 Daisy Putih — kemurnian, kepolosan, dan cinta yang setia, mengikat seluruh buket dengan ketulusan."
        ]
    }
};

const overlay     = document.getElementById("overlay");
const modalEmoji  = document.getElementById("modalEmoji");
const modalTitle  = document.getElementById("modalTitle");
const modalBody   = document.getElementById("modalBody");
const modalClose  = document.getElementById("modalClose");

function openMeaning(key){
    const m = meanings[key];
    if(!m) return;
    modalEmoji.textContent = m.emoji;
    modalTitle.textContent = m.title;
    modalBody.innerHTML = m.body.map(p => "<p>" + p + "</p>").join("");
    overlay.classList.add("show");
}
function closeMeaning(){ overlay.classList.remove("show"); }

document.querySelectorAll("[data-meaning]").forEach(el => {
    el.addEventListener("click", () => openMeaning(el.getAttribute("data-meaning")));
});
document.getElementById("meaningButton").addEventListener("click", () => openMeaning("all"));
modalClose.addEventListener("click", closeMeaning);
overlay.addEventListener("click", (e) => { if(e.target === overlay) closeMeaning(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeMeaning(); });

/* =========================================================
   AMBIENT BOKEH
========================================================= */
(function createBokeh(){
    const layer = document.getElementById("bokehLayer");
    for(let i=0;i<10;i++){
        const b = document.createElement("div");
        b.className = "bokeh";
        const size = 6 + Math.random()*14;
        b.style.width = size+"px";
        b.style.height = size+"px";
        b.style.left = (Math.random()*100)+"%";
        b.style.top = (58 + Math.random()*35)+"%";
        b.style.animationDuration = (9 + Math.random()*9)+"s";
        b.style.animationDelay = (Math.random()*8)+"s";
        layer.appendChild(b);
    }
})();

/* =========================================================
   ELEMENTS
========================================================= */
const button    = document.getElementById("bloomButton");
const paperBack  = document.getElementById("paperBack");
const paperFront = document.getElementById("paperFront");
const ribbon     = document.getElementById("ribbon");
const hintText   = document.getElementById("hintText");

const sunTop    = document.getElementById("sunTop");
const sunLeft   = document.getElementById("sunLeft");
const sunRight  = document.getElementById("sunRight");
const carnation = document.getElementById("carnation");
const roseLeft  = document.getElementById("roseLeft");
const roseRight = document.getElementById("roseRight");
const daisy1 = document.getElementById("daisy1");
const daisy2 = document.getElementById("daisy2");
const daisy3 = document.getElementById("daisy3");
const daisy4 = document.getElementById("daisy4");

const stems    = document.querySelectorAll(".stem");
const leaves   = document.querySelectorAll(".leaf");
const sparkles = document.querySelectorAll(".sparkle");

/* =========================================================
   RESPONSIVE SCALING (halus, tanpa breakpoint yang patah-patah)
========================================================= */
const bouquetStage  = document.getElementById("bouquetStage");
const bouquetCanvas = document.getElementById("bouquetCanvas");
const NATURAL_W = 1000;
const NATURAL_H = 1220;

function scaleBouquet(){
    const maxW = window.innerWidth * 0.94;
    const maxH = window.innerHeight * 0.8;
    const scale = Math.min(1, maxW / NATURAL_W, maxH / NATURAL_H);
    bouquetCanvas.style.transform = "scale(" + scale + ")";
    bouquetStage.style.width  = (NATURAL_W * scale) + "px";
    bouquetStage.style.height = (NATURAL_H * scale) + "px";
}
scaleBouquet();
window.addEventListener("resize", scaleBouquet);
window.addEventListener("orientationchange", scaleBouquet);

/* =========================================================
   BACKGROUND MUSIC
========================================================= */
const bgMusic     = document.getElementById("bgMusic");
const musicToggle = document.getElementById("musicToggle");

function updateMusicIcon(){
    musicToggle.textContent = bgMusic.paused ? "🔈" : "🔊";
}
function tryPlayMusic(){
    bgMusic.play().then(updateMusicIcon).catch(() => { /* diblokir browser sampai ada interaksi user */ });
}
musicToggle.addEventListener("click", () => {
    if(bgMusic.paused){ tryPlayMusic(); } else { bgMusic.pause(); updateMusicIcon(); }
});

/* =========================================================
   RESET
========================================================= */
function resetBloom(){
    paperBack.style.opacity = "0";
    paperBack.style.transform = "translateX(-50%) scaleY(0)";
    paperFront.style.opacity = "0";
    paperFront.style.transform = "translateX(-50%) scaleY(0)";

    ribbon.classList.remove("show");
    hintText.classList.remove("show");

    stems.forEach(s => s.classList.remove("grow-stem"));
    leaves.forEach(l => l.classList.remove("show"));

    document.querySelectorAll(".sun-head, .carnation-head, .rose-head, .daisy-head")
        .forEach(h => h.classList.remove("open"));

    sparkles.forEach(s => s.classList.remove("active"));
}

/* =========================================================
   BLOOM SEQUENCE
========================================================= */
function startBloom(){

    resetBloom();
    button.innerHTML = "🌱 Bunga sedang tumbuh...";
    tryPlayMusic();

    /* 1. tangkai tumbuh */
    setTimeout(() => {
        stems.forEach((stem, i) => setTimeout(() => stem.classList.add("grow-stem"), i*120));
    }, 400);

    setTimeout(() => {
        leaves.forEach((leaf, i) => setTimeout(() => leaf.classList.add("show"), i*130));
    }, 1400);

    /* 2. ikat tangkai dengan pita — sebelum bunga mekar */
    setTimeout(() => ribbon.classList.add("show"), 3400);

    /* 3. baru bunga mekar satu per satu */
    setTimeout(() => sunTop.classList.add("open"),   4600);
    setTimeout(() => sunLeft.classList.add("open"),  4900);
    setTimeout(() => sunRight.classList.add("open"), 5100);

    setTimeout(() => carnation.classList.add("open"), 5700);

    setTimeout(() => roseLeft.classList.add("open"),  6200);
    setTimeout(() => roseRight.classList.add("open"), 6380);

    setTimeout(() => daisy1.classList.add("open"), 6850);
    setTimeout(() => daisy2.classList.add("open"), 7020);
    setTimeout(() => daisy3.classList.add("open"), 7190);
    setTimeout(() => daisy4.classList.add("open"), 7360);

    /* 4. semua bunga sudah mekar penuh — baru sekarang dibungkus kertas */
    setTimeout(() => {
        paperBack.style.transition = "opacity 1.6s ease, transform 1.9s cubic-bezier(.16,1,.3,1)";
        paperBack.style.opacity = "1";
        paperBack.style.transform = "translateX(-50%) scaleY(1)";
    }, 8900);

    setTimeout(() => {
        paperFront.style.transition = "opacity 1.4s ease, transform 1.6s cubic-bezier(.16,1,.3,1)";
        paperFront.style.opacity = "1";
        paperFront.style.transform = "translateX(-50%) scaleY(1)";
    }, 9300);

    setTimeout(() => {
        sparkles.forEach((sp, i) => setTimeout(() => sp.classList.add("active"), i*180));
    }, 10400);

    setTimeout(() => hintText.classList.add("show"), 10900);

    setTimeout(() => { button.innerHTML = "🌸 Bloom Lagi"; }, 11900);
}

button.addEventListener("click", startBloom);
setTimeout(startBloom, 900);

</script>

</body>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparkle & Glitter Effect</title>
<style>
/* Reset & Latar Belakang Transparan/Gelap agar Efek Terlihat Jelas */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0f0c1b; /* Latar gelap agar kilauan terlihat kontras */
}

/* Container Efek Sparkle */
.sparkle-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
}

/* 1. Animasi Glitter (Partikel Bulat Bercahaya) */
.glitter-particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #ffe8a3 60%, rgba(255,215,0,0) 100%);
    box-shadow: 0 0 10px #ffffff, 0 0 18px #ffd700;
    pointer-events: none;
    animation: continuousGlitter linear infinite;
}

@keyframes continuousGlitter {
    0% {
        opacity: 0;
        transform: translateY(0) scale(0) rotate(0deg);
    }
    30% {
        opacity: 0.9;
        transform: translateY(-25px) scale(1.2) rotate(90deg);
    }
    70% {
        opacity: 0.7;
        transform: translateY(-60px) scale(0.8) rotate(180deg);
    }
    100% {
        opacity: 0;
        transform: translateY(-90px) scale(0) rotate(270deg);
    }
}

/* 2. Animasi Sparkle (Bintang Kerlip) */
.star-sparkle {
    position: absolute;
    width: 14px; 
    height: 14px;
    pointer-events: none;
    animation: continuousStar ease-in-out infinite alternate;
}

.star-sparkle::before, .star-sparkle::after {
    content: '';
    position: absolute;
    background: #ffffff;
    box-shadow: 0 0 10px #ffe599, 0 0 15px #ffffff;
    border-radius: 2px;
}

.star-sparkle::before { top: 6px; left: 0; width: 14px; height: 2px; }
.star-sparkle::after { top: 0; left: 6px; width: 2px; height: 14px; }

@keyframes continuousStar {
    0% { 
        opacity: 0; 
        transform: scale(0.2) rotate(0deg); 
    }
    50% { 
        opacity: 1; 
        transform: scale(1.4) rotate(90deg); 
    }
    100% { 
        opacity: 0; 
        transform: scale(0.2) rotate(180deg); 
    }
}
</style>
</head>
<body>

    <!-- Container Utama Animasi -->
    <div class="sparkle-container" id="sparkleContainer"></div>

    <script>
    function startContinuousSparkles() {
        const container = document.getElementById('sparkleContainer');

        // Partikel Glitter (Terus-menerus)
        setInterval(() => {
            const glitter = document.createElement('div');
            glitter.className = 'glitter-particle';
            
            const size = Math.random() * 6 + 3; // Ukuran 3px - 9px
            const left = Math.random() * 100;   // Posisi horizontal
            const top = Math.random() * 80 + 10; // Posisi vertikal
            const duration = Math.random() * 2 + 2; // Durasi animasi

            glitter.style.width = `${size}px`;
            glitter.style.height = `${size}px`;
            glitter.style.left = `${left}%`;
            glitter.style.top = `${top}%`;
            glitter.style.animationDuration = `${duration}s`;

            container.appendChild(glitter);

            setTimeout(() => glitter.remove(), duration * 1000);
        }, 150);

        // Bintang Sparkle Kerlip (Terus-menerus)
        setInterval(() => {
            const star = document.createElement('div');
            star.className = 'star-sparkle';
            
            const left = Math.random() * 90 + 5;
            const top = Math.random() * 80 + 10;
            const duration = Math.random() * 1.5 + 1.5;

            star.style.left = `${left}%`;
            star.style.top = `${top}%`;
            star.style.animationDuration = `${duration}s`;

            container.appendChild(star);

            setTimeout(() => star.remove(), duration * 1000);
        }, 300);
    }

    // Jalankan animasi saat file dibuka
    window.addEventListener('DOMContentLoaded', startContinuousSparkles);
    </script>

</body>
</html>
